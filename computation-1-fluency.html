<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Computation — Double-Digit Addition (No Regrouping)</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500;600&display=swap');
  :root{--bg:#DDD0F5;--surface:#EDE5FF;--border:#C4ADEE;--text-primary:#1E1530;--text-secondary:#584C72;--text-muted:#9589B8;--accent:#6845A8;--accent-light:#EEE6FF;--accent-warm:#D4600A;--accent-warm-light:#FBF0E4;--error:#C0392B;--radius:12px;--radius-lg:20px;}
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text-primary);min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;background-image:url("data:image/svg+xml,%3Csvg width='64' height='64' viewBox='0 0 64 64' xmlns='http://www.w3.org/2000/svg'%3E%3Crect x='2' y='2' width='14' height='5' fill='%236845A8' fill-opacity='0.28'/%3E%3Crect x='2' y='9' width='7' height='5' fill='%236845A8' fill-opacity='0.22'/%3E%3Crect x='11' y='9' width='5' height='5' fill='%232B5DC7' fill-opacity='0.30'/%3E%3Crect x='40' y='4' width='10' height='5' fill='%232B5DC7' fill-opacity='0.34'/%3E%3Crect x='40' y='11' width='6' height='5' fill='%232B5DC7' fill-opacity='0.24'/%3E%3Crect x='48' y='11' width='4' height='5' fill='%236845A8' fill-opacity='0.20'/%3E%3Crect x='4' y='48' width='12' height='5' fill='%236845A8' fill-opacity='0.24'/%3E%3Crect x='4' y='55' width='6' height='5' fill='%232B5DC7' fill-opacity='0.28'/%3E%3Crect x='12' y='55' width='4' height='5' fill='%236845A8' fill-opacity='0.18'/%3E%3Crect x='44' y='32' width='8' height='5' fill='%232B5DC7' fill-opacity='0.30'/%3E%3Crect x='28' y='22' width='5' height='5' fill='%232B5DC7' fill-opacity='0.24'/%3E%3Crect x='18' y='44' width='10' height='5' fill='%236845A8' fill-opacity='0.22'/%3E%3Crect x='52' y='44' width='6' height='5' fill='%232B5DC7' fill-opacity='0.28'/%3E%3C/svg%3E");background-size:128px 128px;}

  .app{width:100%;max-width:640px;display:flex;flex-direction:column;gap:14px;}
  .header{display:flex;align-items:center;gap:12px;}
  .lesson-label{font-family:'DM Serif Display',serif;font-size:24px;letter-spacing:-0.5px;}
  .phase-label{font-size:12px;font-weight:500;color:var(--text-muted);text-transform:uppercase;letter-spacing:1px;flex:1;}

  /* Problem display */
  .model-area{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:32px 24px;display:flex;align-items:center;justify-content:center;min-height:160px;overflow:visible;}

  /* Answer row */
  .answer-row{display:flex;align-items:center;gap:12px;}
  .answer-prompt{font-size:14px;font-weight:600;color:var(--text-secondary);flex:1;}
  .num-input{width:96px;height:52px;border:2px solid var(--border);border-radius:var(--radius);background:var(--surface);font-family:'DM Serif Display',serif;font-size:28px;text-align:center;color:var(--text-primary);outline:none;transition:border-color 0.15s,background 0.15s;-moz-appearance:textfield;}
  .num-input::-webkit-outer-spin-button,.num-input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0;}
  .num-input:focus{border-color:var(--accent);}
  .num-input.correct{border-color:#2D6A4F;background:#E8F5EE;}
  .num-input.wrong{border-color:var(--error);background:#FDE8E8;}
  .btn-check{padding:11px 22px;border-radius:var(--radius);border:none;background:var(--accent);color:white;font-family:'DM Sans',sans-serif;font-size:15px;font-weight:600;cursor:pointer;transition:background 0.15s,box-shadow 0.15s;flex-shrink:0;}
  .btn-check:hover{background:#512F8A;box-shadow:0 0 0 2px #F0922B,0 0 12px 3px rgba(240,146,43,0.52),0 0 26px 7px rgba(240,146,43,0.24);}

  /* Feedback */
  .feedback-flash{font-size:15px;font-weight:700;min-height:22px;text-align:center;}
  .flash-ok{color:#2D6A4F;}
  .flash-err{color:var(--error);}

  /* Drill header */
  .drill-header{display:flex;align-items:center;gap:14px;}
  .score-block{flex:1;display:flex;gap:16px;align-items:baseline;}
  .score-c{font-family:'DM Serif Display',serif;font-size:28px;color:var(--accent);}
  .score-e{font-family:'DM Serif Display',serif;font-size:20px;color:var(--error);}
  .score-sub{font-size:12px;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.5px;}

  /* Timer */
  .timer-ring{position:relative;width:56px;height:56px;flex-shrink:0;}
  .timer-ring svg{transform:rotate(-90deg);}
  .timer-ring .bg{fill:none;stroke:var(--border);stroke-width:5;}
  .timer-ring .fg{fill:none;stroke:var(--accent);stroke-width:5;stroke-linecap:round;transition:stroke-dashoffset 1s linear,stroke 0.3s;}
  .timer-ring .fg.urgent{stroke:var(--error);}
  .timer-label{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:'DM Serif Display',serif;font-size:17px;}

  /* Cards */
  .intro-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:28px 32px;}
  .intro-card h2{font-family:'DM Serif Display',serif;font-size:22px;margin-bottom:12px;}
  .intro-card p{font-size:14px;line-height:1.6;color:var(--text-secondary);margin-bottom:8px;}
  .start-btn{width:100%;padding:14px;border-radius:var(--radius);border:none;background:var(--accent);color:white;font-family:'DM Sans',sans-serif;font-size:16px;font-weight:600;cursor:pointer;margin-top:14px;transition:background 0.15s,box-shadow 0.15s;}
  .start-btn:hover{background:#512F8A;box-shadow:0 0 0 2px #F0922B,0 0 14px 4px rgba(240,146,43,0.55),0 0 32px 10px rgba(240,146,43,0.28);}

  .results-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:28px 32px;text-align:center;box-shadow:0 2px 12px rgba(0,0,0,0.04);}
  .results-card h2{font-family:'DM Serif Display',serif;font-size:24px;color:var(--accent);margin-bottom:18px;}
  .rate-row{display:flex;gap:20px;justify-content:center;margin-bottom:16px;}
  .rate-stat{text-align:center;}
  .rate-num{font-family:'DM Serif Display',serif;font-size:44px;}
  .rate-num.c{color:var(--accent);}
  .rate-num.e{color:var(--error);}
  .rate-sub{font-size:11px;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:1px;margin-top:2px;}

  /* Pig */
  .pig-intro{display:flex;align-items:center;gap:12px;margin:14px 0 4px;}
  .pig-intro img{width:48px;height:auto;image-rendering:pixelated;flex-shrink:0;}
  .pig-intro-line{font-size:13px;font-weight:600;color:var(--text-secondary);font-style:italic;}
  #pigeon-overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(221,208,245,0.72);backdrop-filter:blur(4px);z-index:999;}
  .pig-inner{display:flex;align-items:flex-end;gap:16px;padding:32px;}
  .pig-inner img{width:100px;image-rendering:pixelated;}
  .pig-bubble{background:var(--surface);border:2px solid var(--accent);border-radius:16px;padding:20px 24px;font-family:'DM Sans',sans-serif;font-size:16px;font-weight:600;max-width:260px;line-height:1.5;}
  .pig-sub{font-size:13px;font-weight:400;color:var(--text-secondary);margin-top:6px;}

  /* Example problems on intro */
  .examples{display:flex;gap:12px;flex-wrap:wrap;margin:12px 0 4px;}
  .example-eq{background:var(--accent-light);border:1px solid #C4ADEE;border-radius:var(--radius);padding:10px 16px;font-family:'DM Serif Display',serif;font-size:20px;color:var(--accent);white-space:nowrap;}

  @keyframes fadeUp{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}
  .fu{animation:fadeUp 0.18s ease;}
</style>
</head>
<body>
<div class="app">
  <div class="header">
    <span class="lesson-label">Computation 1</span>
    <span class="phase-label" id="phaseLabel">Practice</span>
  </div>
  <div id="main"></div>
</div>
<script>
// ── Config ─────────────────────────────────────────────────────────────────────
const CFG={id:1,label:'Double-Digit Addition (No Regrouping)',compType:'dd-add-no-regroup',storageKey:'computation_1_fluency_sessions',chartId:32,chartHref:'chart.html'};

// ── Storage ────────────────────────────────────────────────────────────────────
function loadSessions(){try{const r=localStorage.getItem(CFG.storageKey);return r?JSON.parse(r):[];}catch(e){return[];}}
function saveSession(s){try{const a=loadSessions();a.push(s);localStorage.setItem(CFG.storageKey,JSON.stringify(a));}catch(e){}}

// ── Equation renderer ──────────────────────────────────────────────────────────
function numSpan(val,isUnk){
  const text=isUnk?'?':String(val);
  const len=String(val).length;
  const fs=isUnk?'52px':len>=3?'38px':len>=2?'48px':'56px';
  const color=isUnk?'var(--accent)':'var(--text-primary)';
  const fi=isUnk?'italic':'normal';
  const minW=len>=3?'58px':'52px';
  return`<span style="font-family:'DM Serif Display',serif;font-size:${fs};color:${color};font-style:${fi};min-width:${isUnk?'52px':minW};text-align:center;display:inline-block;line-height:1">${text}</span>`;
}
function opSpan(op){
  return`<span style="font-family:'DM Sans',sans-serif;font-size:36px;color:var(--text-muted);font-weight:300;padding:0 8px">${op}</span>`;
}

function renderEq(item){
  const{a,b,whole,op,unknownRole}=item;
  return`<div style="display:flex;align-items:center;justify-content:center;flex-wrap:nowrap">
    ${numSpan(a,unknownRole==='p1')}${opSpan(op)}${numSpan(b,unknownRole==='p2')}${opSpan('=')}${numSpan(whole,unknownRole==='whole')}
  </div>`;
}

// ── Item generators ────────────────────────────────────────────────────────────
function genDDAddNoRegroup(){
  const aTens=1+Math.floor(Math.random()*8);
  const bTens=1+Math.floor(Math.random()*(9-aTens));
  const aOnes=Math.floor(Math.random()*9);
  const bOnes=Math.floor(Math.random()*(10-aOnes));
  const a=aTens*10+aOnes, b=bTens*10+bOnes, whole=a+b;
  return{a,b,whole,op:'+',unknownRole:'whole',answer:whole};
}

function genItem(){
  const t=CFG.compType;
  if(t==='dd-add-no-regroup') return genDDAddNoRegroup();
  return genDDAddNoRegroup();
}

// ── Examples for intro ─────────────────────────────────────────────────────────
function makeExamples(){
  const ex=[];
  for(let i=0;i<3;i++){const it=genItem();it.unknownRole='whole';it.answer=it.whole;ex.push(it);}
  return ex.map(it=>`<div class="example-eq">${it.a} + ${it.b} = ${it.whole}</div>`).join('');
}

// ── Timer ──────────────────────────────────────────────────────────────────────
const DUR=60,CIRC=2*Math.PI*24;
function tRing(t){const off=CIRC*(1-t/DUR);return`<div class="timer-ring"><svg width="56" height="56" viewBox="0 0 56 56"><circle class="bg" cx="28" cy="28" r="24"/><circle class="fg${t<=10?' urgent':''}" cx="28" cy="28" r="24" stroke-dasharray="${CIRC.toFixed(1)}" stroke-dashoffset="${off.toFixed(1)}"/></svg><div class="timer-label">${t}</div></div>`;}

// ── State ──────────────────────────────────────────────────────────────────────
const S={phase:'intro',t:DUR,timer:null,cor:0,err:0,item:null,start:null};
function render(h){document.getElementById('main').innerHTML=h;}
function setPhase(l){document.getElementById('phaseLabel').textContent=l;}

// ── Pigeon lines ───────────────────────────────────────────────────────────────
const PIG_BEFORE=['Ready when you are.','No rush. I\'ll be here.','Whenever you\'re set.','You know these. Show it.','Go fast, stay accurate.'];
const PIG_AFTER=['That was a good one.','Good work.','That went well.','You showed up. That matters.','Let\'s see where that lands.'];
const PIG_IMPROVED=['You\'re getting it.','That one was better.','Getting closer.','That\'s a real improvement.','Progress. Quiet, steady progress.'];
function pigLine(pool){return pool[Math.floor(Math.random()*pool.length)];}

// ── Intro ──────────────────────────────────────────────────────────────────────
function showIntro(){
  S.phase='intro';setPhase('Practice');
  render(`<div class="intro-card fu">
    <h2>${CFG.label}</h2>
    <p>What is the sum? Type it and press <strong>Enter</strong>.</p>
    <p>Both digits add without carrying — ones column stays ≤ 9, tens column stays ≤ 9.</p>
    <div class="examples">${makeExamples()}</div>
    <p style="color:var(--accent);font-weight:600">60 seconds — go as fast as you accurately can.</p>
    <div class="pig-intro"><img src="Icons/pigeon.png" alt="Pigeon"><div class="pig-intro-line">${pigLine(PIG_BEFORE)}</div></div>
    <button class="start-btn" onclick="startDrill()">Start</button>
  </div>`);
}

// ── Drill ──────────────────────────────────────────────────────────────────────
function startDrill(){
  S.phase='drill';S.cor=0;S.err=0;S.t=DUR;S.start=new Date().toISOString();
  setPhase('Practice');
  nextItem();
  S.timer=setInterval(()=>{S.t--;updateT();if(S.t<=0)endDrill();},1000);
}

function nextItem(){
  S.item=genItem();
  drawDrill();
  setTimeout(()=>{const el=document.getElementById('answerInput');if(el){el.value='';el.focus();}},40);
}

function drawDrill(){
  render(`<div class="drill-header fu">
    ${tRing(S.t)}
    <div class="score-block">
      <div><div class="score-c">${S.cor}</div><div class="score-sub">correct</div></div>
      ${S.err?`<div><div class="score-e">${S.err}</div><div class="score-sub">errors</div></div>`:''}
    </div>
  </div>
  <div class="model-area fu">${renderEq(S.item)}</div>
  <div class="answer-row">
    <span class="answer-prompt">Type the missing number</span>
    <input type="text" inputmode="numeric" id="answerInput" class="num-input" autocomplete="off" onkeydown="if(event.key==='Enter')submitAnswer()">
    <button class="btn-check" onclick="submitAnswer()">✓</button>
  </div>
  <div class="feedback-flash" id="flashMsg"></div>`);
}

function updateT(){
  const r=document.querySelector('.timer-ring');if(!r)return;
  const off=CIRC*(1-S.t/DUR);
  const fg=r.querySelector('.fg'),lb=r.querySelector('.timer-label');
  if(fg){fg.setAttribute('stroke-dashoffset',off.toFixed(1));if(S.t<=10)fg.classList.add('urgent');}
  if(lb)lb.textContent=S.t;
}

function submitAnswer(){
  if(S.phase!=='drill')return;
  const el=document.getElementById('answerInput');if(!el)return;
  const val=parseInt(el.value,10);if(isNaN(val)){el.focus();return;}
  const fm=document.getElementById('flashMsg');
  if(val===S.item.answer){
    S.cor++;
    el.classList.add('correct');
    if(fm){fm.className='feedback-flash flash-ok';fm.textContent='✓';}
    setTimeout(nextItem,220);
  }else{
    S.err++;
    el.classList.add('wrong');
    if(fm){fm.className='feedback-flash flash-err';fm.textContent=`Answer: ${S.item.answer}`;}
    setTimeout(()=>{
      if(S.phase!=='drill')return;
      el.classList.remove('wrong');el.value='';
      if(fm)fm.textContent='';el.focus();
    },1300);
  }
}

// ── End drill ─────────────────────────────────────────────────────────────────
function endDrill(){
  clearInterval(S.timer);S.phase='results';setPhase('Results');
  const cpm=S.cor,epm=S.err;
  saveSession({date:S.start,lesson:CFG.chartId,phase:'fluency',corrects:S.cor,errors:S.err,cpm,epm,duration:DUR});
  render(`<div class="results-card fu">
    <h2>Session Complete</h2>
    <div class="rate-row">
      <div class="rate-stat"><div class="rate-num c">${cpm}</div><div class="rate-sub">Correct / min</div></div>
      <div style="font-size:26px;color:var(--text-muted);padding-top:10px">/</div>
      <div class="rate-stat"><div class="rate-num e">${epm}</div><div class="rate-sub">Errors / min</div></div>
    </div>
    <p style="color:var(--text-secondary);font-size:14px;margin-bottom:16px">${S.cor} correct and ${S.err} error${S.err!==1?'s':''} in 60 seconds.</p>
  </div>`);
  showPigeonTransition(1500);
}

// ── Pigeon transition ─────────────────────────────────────────────────────────
function showPigeonTransition(delayMs){
  setTimeout(()=>{
    try{localStorage.setItem('chart_new_lesson',String(CFG.chartId));}catch(e){}
    const currentCpm=S.cor;
    const prevSessions=loadSessions().slice(0,-1);
    const prevBest=prevSessions.reduce((best,s)=>Math.max(best,s.cpm||0),0);
    const improved=prevBest>0&&currentCpm>prevBest;
    const mainLine=improved?pigLine(PIG_IMPROVED):pigLine(PIG_AFTER);
    const subMsg=`<div class="pig-sub">Let's chart your timing.</div>`;
    const overlay=document.createElement('div');
    overlay.id='pigeon-overlay';
    overlay.innerHTML=`<div class="pig-inner"><div class="pig-bubble">${mainLine}${subMsg}</div><img src="Icons/pigeon.png" alt="Pigeon"></div>`;
    document.body.appendChild(overlay);
    setTimeout(()=>{window.location.href=CFG.chartHref;},2800);
  },delayMs||0);
}

showIntro();
</script>
</body>
</html>
